name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m py_compile autowifi.py wpa_crack.py tests/smoke.py
      - name: Smoke suite
        run: python tests/smoke.py
      - name: CLI sanity
        run: |
          python autowifi.py --version
          python autowifi.py --scan-json tests/sample_scan.json
          python autowifi.py --scan-json tests/sample_scan.json --json > /dev/null
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n setup-termux-alpine.sh
